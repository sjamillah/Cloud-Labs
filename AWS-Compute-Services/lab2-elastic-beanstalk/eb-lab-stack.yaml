AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Elastic Beanstalk + GitHub Actions CI/CD lab, fully self-contained:
  S3 source bucket (self-bootstrapping and self-emptying via a Lambda-backed
  custom resource), DynamoDB visits table, EC2 instance role, GitHub OIDC
  deploy role, and the Elastic Beanstalk application/environment itself.
  Outputs give the GitHub Actions pipeline everything it needs to version,
  package, and deploy against this stack without any hardcoded names.

Parameters:
  ProjectName:
    Type: String
    Default: eb-deploy-python-lab
    Description: Prefixes most resource names

  GitHubOrg:
    Type: String
    Description: GitHub username/org that owns the repo

  GitHubRepo:
    Type: String
    Description: Bare repo name only, no URL

  GitHubBranch:
    Type: String
    Default: main

  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Set to true only if a GitHub OIDC provider does not already exist in this account

  ExistingOIDCProviderArn:
    Type: String
    Default: ''
    Description: Required if CreateOIDCProvider is false - the ARN of your existing GitHub OIDC provider

  EBSolutionStackName:
    Type: String
    Default: "64bit Amazon Linux 2023 v4.13.5 running Python 3.12"
    Description: >
      VERIFY THIS before deploying - solution stack strings change over time.
      Run: aws elasticbeanstalk list-available-solution-stacks
      --query "SolutionStacks[?contains(@,'Python')]" and use the current
      exact string for your region.

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ProjectName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation

  BucketLifecycleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-bucket-lifecycle-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bucket-lifecycle-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !GetAtt SourceBucket.Arn
                  - !Sub ${SourceBucket.Arn}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-bucket-lifecycle:*

  BucketLifecycleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-bucket-lifecycle
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt BucketLifecycleRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import zipfile
          import io

          s3 = boto3.client('s3')

          def send_response(event, context, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': event.get('PhysicalResourceId', context.log_stream_name),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', str(len(body)))
              urllib.request.urlopen(req)

          def empty_bucket(bucket):
              try:
                  paginator = s3.get_paginator('list_object_versions')
                  for page in paginator.paginate(Bucket=bucket):
                      objs = [{'Key': v['Key'], 'VersionId': v['VersionId']} for v in page.get('Versions', [])]
                      objs += [{'Key': m['Key'], 'VersionId': m['VersionId']} for m in page.get('DeleteMarkers', [])]
                      if objs:
                          s3.delete_objects(Bucket=bucket, Delete={'Objects': objs})
              except s3.exceptions.NoSuchBucket:
                  pass # If already deleted, ignore and proceed cleanly

          def bootstrap_bundle(bucket, key):
              app_py = (
                  'import os\n'
                  'from flask import Flask, jsonify\n'
                  'application = Flask(__name__)\n\n'
                  '@application.route("/")\n'
                  'def home():\n'
                  '    return jsonify({"message": "bootstrap placeholder - awaiting first real deploy"})\n\n'
                  '@application.route("/health")\n'
                  'def health():\n'
                  '    return jsonify({"status": "ok"}), 200\n'
              )
              procfile = 'web: gunicorn --bind :8000 application:application\n'
              reqs = 'Flask==3.0.3\ngunicorn==22.0.0\n'
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as zf:
                  zf.writestr('application.py', app_py)
                  zf.writestr('Procfile', procfile)
                  zf.writestr('requirements.txt', reqs)
              buf.seek(0)
              s3.put_object(Bucket=bucket, Key=key, Body=buf.read())

          def handler(event, context):
              try:
                  props = event.get('ResourceProperties', {})
                  bucket = props['BucketName']
                  key = props.get('BootstrapKey', 'bootstrap/initial-bundle.zip')
                  if event['RequestType'] in ('Create', 'Update'):
                      bootstrap_bundle(bucket, key)
                  elif event['RequestType'] == 'Delete':
                      empty_bucket(bucket)
                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  send_response(event, context, 'FAILED', str(e))

  BucketLifecycleManager:
    Type: Custom::BucketLifecycleManager
    DependsOn: SourceBucket
    Properties:
      ServiceToken: !GetAtt BucketLifecycleFunction.Arn
      BucketName: !Ref SourceBucket
      BootstrapKey: bootstrap/initial-bundle.zip

  VisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eb-app-visits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: counter_id
          AttributeType: S
      KeySchema:
        - AttributeName: counter_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
      Policies:
        - PolicyName: dynamodb-visits-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt VisitsTable.Arn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${ProjectName}-role
      Roles: [!Ref EC2InstanceRole]

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: ['6938fd4d98bab03faadb97b34396831e3780aea1']

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eb-github-deploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [ShouldCreateOIDCProvider, !Ref GitHubOIDCProvider, !Ref ExistingOIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: deploy-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${SourceBucket.Arn}/*
              - Effect: Allow
                Action:
                  - elasticbeanstalk:CreateApplicationVersion
                  - elasticbeanstalk:UpdateEnvironment
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticbeanstalk:DescribeApplicationVersions
                  - elasticbeanstalk:DescribeEvents
                Resource: '*'

  EBApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ProjectName

  EBApplicationVersion:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    DependsOn: BucketLifecycleManager
    Properties:
      ApplicationName: !Ref EBApplication
      SourceBundle:
        S3Bucket: !Ref SourceBucket
        S3Key: bootstrap/initial-bundle.zip

  EBEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: !Sub ${ProjectName}-env
      ApplicationName: !Ref EBApplication
      SolutionStackName: !Ref EBSolutionStackName
      VersionLabel: !Ref EBApplicationVersion
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref EC2InstanceProfile
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: SingleInstance
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: AWS_REGION
          Value: !Ref AWS::Region
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: DYNAMODB_TABLE_NAME
          Value: !Ref VisitsTable

Outputs:
  SourceBucketName:
    Value: !Ref SourceBucket
  VisitsTableName:
    Value: !Ref VisitsTable
  EC2InstanceRoleName:
    Value: !Ref EC2InstanceRole
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  EBApplicationName:
    Value: !Ref EBApplication
  EBEnvironmentName:
    Value: !Ref EBEnvironment
  EBEnvironmentURL:
    Value: !GetAtt EBEnvironment.EndpointURL