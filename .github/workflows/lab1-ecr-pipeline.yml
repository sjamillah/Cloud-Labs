name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - 'AWS-Containerization/lab1-ecr-docker-pipeline/**'
      - '.github/workflows/lab1-ecr-pipeline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecr-github-lab-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.APP_NAME }}
        run: |
          # run_number alone is not unique - re-running a workflow keeps it and
          # only bumps run_attempt, so both are needed for a distinct tag.
          IMAGE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ${{ vars.LAB_DIR }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test the pushed image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.APP_NAME }}
        run: |
          IMAGE_TAG="v${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}"
          docker run -d --name smoke -p 8080:8080 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break || sleep 1
          done
          curl -fsS "http://localhost:8080/api/guess?word=about" > /dev/null
          curl -fsS http://localhost:8080/ > /dev/null
          docker rm -f smoke
          echo "Smoke test passed" >> $GITHUB_STEP_SUMMARY
