name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - 'AWS-Containerization/lab1-ecr-docker-pipeline/**'
      - '.github/workflows/lab1-ecr-pipeline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Debug OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Resolve repository variables
        run: |
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${{ vars.APP_NAME }}" >> "$GITHUB_ENV"
          echo "LAB_DIR=${{ vars.LAB_DIR }}" >> "$GITHUB_ENV"
          echo "FULL_NAME=${{ vars.FULL_NAME }}" >> "$GITHUB_ENV"

      - name: Verify variables actually resolved
        run: |
          echo "AWS_REGION=[$AWS_REGION]"
          echo "ECR_REPOSITORY=[$ECR_REPOSITORY]"
          echo "LAB_DIR=[$LAB_DIR]"
          echo "FULL_NAME=[$FULL_NAME]"
          if [ -z "$AWS_REGION" ] || [ -z "$ECR_REPOSITORY" ] || [ -z "$LAB_DIR" ] || [ -z "$FULL_NAME" ]; then
            echo "::error::One or more repository variables are empty - go check Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecr-github-lab-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${FULL_NAME}_${ECR_REPOSITORY}
          docker build --target target -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $LAB_DIR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG