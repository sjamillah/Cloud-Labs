name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - 'AWS-Containerization/lab1-ecr-docker-pipeline/**'
      - '.github/workflows/lab1-ecr-pipeline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show real token claims
        run: |
          JWT=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d '.' -f2 | tr '_-' '/+')
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | base64 -d | jq .

      - name: Resolve repository variables
        run: |
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${{ vars.APP_NAME }}" >> "$GITHUB_ENV"
          echo "LAB_DIR=${{ vars.LAB_DIR }}" >> "$GITHUB_ENV"
          echo "FULL_NAME=${{ vars.FULL_NAME }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecr-github-lab-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${FULL_NAME}_${ECR_REPOSITORY}
          docker build --target target -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $LAB_DIR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG