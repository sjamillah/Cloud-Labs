name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [ main ]

concurrency:
  group: eb-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: eb-deploy-python-lab
  EB_APPLICATION_NAME: eb-deploy-python-lab
  EB_ENVIRONMENT_NAME: eb-deploy-python-lab-env
  APP_DIR: AWS-Compute-Services/lab2-elastic-beanstalk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/eb-github-deploy-role
          role-session-name: github-actions-eb-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: eb-deploy-python-lab
          template: ${{ env.APP_DIR }}/eb-lab-stack.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_NAMED_IAM
          parameter-overrides: >-
            ProjectName=${{ env.EB_APPLICATION_NAME }},
            GitHubOrg=${{ github.repository_owner }},
            GitHubRepo=${{ github.event.repository.name }}

      - name: Write version file (short git SHA)
        working-directory: ${{ env.APP_DIR }}
        run: echo "${GITHUB_SHA::7}" > VERSION

      - name: Package application into a source bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          zip -r "app-${GITHUB_SHA}.zip" . \
            -x ".git/*" "venv/*" "__pycache__/*" "*.pyc" ".env" "eb-lab-stack.yaml" "README.md"

      - name: Upload source bundle to S3
        working-directory: ${{ env.APP_DIR }}
        run: |
          aws s3 cp "app-${GITHUB_SHA}.zip" \
            "s3://${{ env.S3_BUCKET }}/app-${GITHUB_SHA}.zip"

      - name: Create new Elastic Beanstalk application version (idempotent)
        run: |
          EXISTING=$(aws elasticbeanstalk describe-application-versions \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-labels "${GITHUB_SHA}" \
            --region "${{ env.AWS_REGION }}" \
            --query "ApplicationVersions[0].VersionLabel" --output text 2>/dev/null || echo "None")

          if [ "$EXISTING" == "${GITHUB_SHA}" ]; then
            echo "Version ${GITHUB_SHA} already exists (likely a re-run) - skipping creation, will still deploy it below."
          else
            aws elasticbeanstalk create-application-version \
              --application-name "${{ env.EB_APPLICATION_NAME }}" \
              --version-label "${GITHUB_SHA}" \
              --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="app-${GITHUB_SHA}.zip" \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Deploy the new version to the environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${GITHUB_SHA}" \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for the environment to finish updating
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Confirm the environment is healthy after deploy
        run: |
          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Environments[0].Health" --output text)

          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Environments[0].Status" --output text)

          echo "Environment health: $HEALTH | Status: $STATUS"

          if [ "$HEALTH" != "Green" ] || [ "$STATUS" != "Ready" ]; then
            echo "::error::Deployment finished but environment is not healthy (Health=$HEALTH, Status=$STATUS). Failing the build."
            exit 1
          fi