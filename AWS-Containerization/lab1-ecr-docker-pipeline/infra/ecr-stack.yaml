AWSTemplateFormatVersion: '2010-09-09'
Description: Private ECR repository for lab1-ecr-pipeline with security best practices

Parameters:
  RepositoryName:
    Type: String
    Default: ecr-github-app
  CIRoleArn:
    Type: String
    Default: arn:aws:iam::697863031884:role/ecr-github-lab-role
    Description: ARN of the GitHub Actions OIDC role allowed to push images

Resources:
  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowPushFromCIRoleOnly
            Effect: Allow
            Principal:
              AWS: !Ref CIRoleArn
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
          - Sid: AllowPullWithinAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
      # ECR permits only ONE rule selecting untagged images. Selecting
      # "untagged" also means :latest can never be expired - a rule using
      # tagStatus "any" would eventually delete the live image.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent superseded builds so a rollback by digest stays possible",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: lab1-ecr-docker-pipeline
        - Key: Environment
          Value: lab
        - Key: ManagedBy
          Value: CloudFormation