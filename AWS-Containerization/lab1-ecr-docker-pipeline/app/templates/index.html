<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Neatly</title>
<style>
    :root {
        --bg:     #f6f2ea;
        --panel:  #fffdf8;
        --ink:    #23201b;
        --soft:   #756c5f;
        --faint:  #a89d8c;
        --line:   #e2d9c8;
        --terra:  #b4552d;
        --moss:   #4a7c52;
        --rust:   #a8342c;
        --mono: "SF Mono", "Cascadia Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg:     #16140f;
            --panel:  #1e1b15;
            --ink:    #efe8da;
            --soft:   #a2988a;
            --faint:  #5e5648;
            --line:   #322c22;
            --terra:  #e08050;
            --moss:   #6fb27c;
            --rust:   #e0655c;
        }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        min-height: 100vh;
        padding: 2rem 1.5rem 3rem;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
    }

    .shell { max-width: 68rem; margin: 0 auto; }

    /* ---------- masthead ---------- */
    header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--line);
        margin-bottom: 1.25rem;
    }

    h1 {
        font-family: var(--serif);
        font-size: 2.1rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1;
    }
    h1 em { font-style: italic; color: var(--terra); }
    .tag { font-size: 0.85rem; color: var(--soft); margin-top: 0.35rem; }

    .controls { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

    .seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button {
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.35rem 0.65rem;
        border: none;
        background: var(--panel);
        color: var(--soft);
        cursor: pointer;
        border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: none; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

    .toggle {
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--soft);
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
    }
    .toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .go {
        font-family: var(--sans);
        font-size: 0.85rem;
        font-weight: 700;
        color: #fff;
        background: var(--terra);
        border: none;
        border-radius: 8px;
        padding: 0.45rem 1.1rem;
        cursor: pointer;
    }
    .go:active { transform: translateY(1px); }

    /* ---------- panes ---------- */
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .pane {
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        min-height: 26rem;
        overflow: hidden;
    }

    .pane .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--line);
    }
    .pane .top span {
        font-family: var(--mono);
        font-size: 0.63rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--faint);
    }
    .mini {
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--soft);
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
    }
    .mini:hover { color: var(--ink); border-color: var(--faint); }

    textarea, pre {
        flex: 1;
        font-family: var(--mono);
        font-size: 0.83rem;
        line-height: 1.65;
        padding: 0.9rem;
        border: none;
        background: none;
        color: var(--ink);
        resize: none;
        overflow: auto;
        tab-size: 2;
    }
    textarea:focus { outline: none; }
    textarea::placeholder { color: var(--faint); }
    pre { white-space: pre; margin: 0; }

    /* ---------- report ---------- */
    .report {
        margin-top: 1rem;
        border-radius: 12px;
        padding: 0.85rem 1.1rem;
        font-size: 0.88rem;
        display: none;
    }
    .report.show { display: block; }
    .report.good { background: color-mix(in srgb, var(--moss) 12%, transparent); border: 1.5px solid var(--moss); }
    .report.bad  { background: color-mix(in srgb, var(--rust) 10%, transparent); border: 1.5px solid var(--rust); }

    .report .headline { font-weight: 700; margin-bottom: 0.2rem; }
    .report.good .headline { color: var(--moss); }
    .report.bad  .headline { color: var(--rust); }

    .where {
        font-family: var(--mono);
        font-size: 0.78rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        margin-top: 0.6rem;
        overflow-x: auto;
        white-space: pre;
        color: var(--soft);
    }
    .where b { color: var(--rust); }

    .facts {
        display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem;
        font-family: var(--mono); font-size: 0.75rem; color: var(--soft);
        margin-top: 0.35rem;
    }
    .facts b { color: var(--ink); font-weight: 700; }

    footer {
        margin-top: 2rem;
        font-size: 0.72rem;
        color: var(--faint);
        text-align: center;
    }
    footer kbd {
        font-family: var(--mono);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.05rem 0.32rem;
    }

    @media (max-width: 800px) {
        .panes { grid-template-columns: 1fr; }
        .pane { min-height: 17rem; }
        header { align-items: flex-start; }
    }
</style>
</head>
<body>
<div class="shell">

    <header>
        <div>
            <h1>Neat<em>ly</em></h1>
            <p class="tag">Paste messy JSON. Get it readable, or get told exactly what's wrong.</p>
        </div>
        <div class="controls">
            <div class="seg" role="group" aria-label="Indent style">
                <button type="button" data-style="2" aria-pressed="true">2</button>
                <button type="button" data-style="4">4</button>
                <button type="button" data-style="tab">tab</button>
                <button type="button" data-style="min">min</button>
            </div>
            <button class="toggle" id="sort" type="button" aria-pressed="false">sort keys</button>
            <button class="go" id="go" type="button">Tidy</button>
        </div>
    </header>

    <div class="panes">
        <div class="pane">
            <div class="top">
                <span>paste here</span>
                <button class="mini" id="sample" type="button">try a sample</button>
            </div>
            <textarea id="in" spellcheck="false" autocomplete="off"
                      placeholder="{&#10;  &quot;paste&quot;: &quot;anything json-ish&quot;&#10;}"></textarea>
        </div>
        <div class="pane">
            <div class="top">
                <span>result</span>
                <button class="mini" id="copy" type="button">copy</button>
            </div>
            <pre id="out"></pre>
        </div>
    </div>

    <div class="report" id="report" aria-live="polite"></div>

    <footer><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to tidy</footer>

</div>

<script>
(function () {
    var elIn     = document.getElementById("in");
    var elOut    = document.getElementById("out");
    var elReport = document.getElementById("report");
    var elSort   = document.getElementById("sort");
    var elGo     = document.getElementById("go");
    var elCopy   = document.getElementById("copy");
    var elSample = document.getElementById("sample");

    var style = "2";
    var sort = false;

    var SAMPLE = '{"name":"neatly","tags":["json","tidy"],"nested":{"deep":{"deeper":[1,2,3]}},"ok":true,"count":42}';

    /* ---------- restore ---------- */
    try {
        var kept = localStorage.getItem("neatly-input");
        if (kept) elIn.value = kept;
    } catch (e) {}

    /* ---------- controls ---------- */
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
        b.addEventListener("click", function () {
            Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (o) {
                o.setAttribute("aria-pressed", "false");
            });
            b.setAttribute("aria-pressed", "true");
            style = b.dataset.style;
            if (elIn.value.trim()) tidy();
        });
    });

    elSort.addEventListener("click", function () {
        sort = !sort;
        elSort.setAttribute("aria-pressed", String(sort));
        if (elIn.value.trim()) tidy();
    });

    elSample.addEventListener("click", function () {
        elIn.value = SAMPLE;
        tidy();
    });

    elGo.addEventListener("click", tidy);

    elIn.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); tidy(); }
    });

    elCopy.addEventListener("click", function () {
        if (!elOut.textContent) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(elOut.textContent)
                .then(function () { flash(elCopy, "copied"); })
                .catch(function () { flash(elCopy, "no luck"); });
        } else { flash(elCopy, "no luck"); }
    });

    function flash(btn, word) {
        var was = btn.textContent;
        btn.textContent = word;
        setTimeout(function () { btn.textContent = was; }, 1400);
    }

    /* ---------- report ---------- */

    function clear() {
        elReport.className = "report";
        elReport.innerHTML = "";
    }

    function good(stats) {
        elReport.className = "report show good";
        elReport.innerHTML =
            '<div class="headline">Valid JSON</div>' +
            '<div class="facts">' +
            '<span>top level <b>' + stats.type + '</b></span>' +
            '<span>depth <b>' + stats.depth + '</b></span>' +
            '<span>keys <b>' + stats.keys + '</b></span>' +
            '<span>array items <b>' + stats.items + '</b></span>' +
            '<span>lines <b>' + stats.lines + '</b></span>' +
            '<span>size <b>' + stats.bytes + '</b> bytes</span>' +
            '</div>';
    }

    function bad(d) {
        elReport.className = "report show bad";
        var html = '<div class="headline">' + escape(d.message) + '</div>';
        if (d.line) {
            html += '<div class="facts"><span>line <b>' + d.line +
                    '</b></span><span>column <b>' + d.column + '</b></span></div>';
        }
        if (d.excerpt !== undefined && d.excerpt !== "") {
            var pad = new Array(Math.max(0, d.column - 1) + 1).join(" ");
            html += '<div class="where">' + escape(d.excerpt) + '\n' + pad + '<b>^</b></div>';
        }
        elReport.innerHTML = html;
    }

    function escape(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* ---------- the work ---------- */

    function tidy() {
        var text = elIn.value;
        try { localStorage.setItem("neatly-input", text); } catch (e) {}

        if (!text.trim()) { elOut.textContent = ""; clear(); return; }

        fetch("/api/tidy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, style: style, sort: sort })
        })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.ok) { elOut.textContent = d.output; good(d.stats); }
                else      { elOut.textContent = ""; bad(d); }
            })
            .catch(function () {
                elOut.textContent = "";
                bad({ message: "Couldn't reach the server." });
            });
    }

    if (elIn.value.trim()) tidy();
})();
</script>
</body>
</html>
